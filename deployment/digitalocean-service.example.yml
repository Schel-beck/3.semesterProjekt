# Add this service under the existing services: section on your DigitalOcean Droplet.
# Keep your existing PostgreSQL, Caddy, volumes and networks intact.
# Docker Hub image published by .github/workflows/main.yml.

  semesterprojekt-api:
    image: rav3n2594/coding-learning-platform:latest
    container_name: semesterprojekt-api
    restart: unless-stopped
    ports:
      - "7070:7070"
    environment:
      DEPLOYED: "true"
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CONNECTION_STR: ${CONNECTION_STR}
      SECRET_KEY: ${SECRET_KEY}
      ISSUER: ${ISSUER}
      TOKEN_EXPIRE_TIME: ${TOKEN_EXPIRE_TIME}
    networks:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7070/auth/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

# Only reuse these names if your existing Compose file already defines them.
# Existing Postgres service should share 'backend' with the API.
